}
button {

    color: white;
    border: none;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 5px;
}
button:disabled {

}
input {
    width: 90%;
    padding: 5px;
    margin-top: 5px;

    margin-top: 8px;
    font-weight: bold;
}
.status.reserved {

function todayDate(){
    const t = new Date();
    return t.toISOString().split("T")[0];
}

function displayBooks(list){
    const container = document.getElementById("books");
    container.innerHTML = "";

    list.forEach((book,index)=>{

        container.innerHTML += `
        <div class="book" id="book-${index}">
            <img src="${book.img}">
            <h3>${book.title}</h3>
            <p>المؤلف: ${book.author}</p>
            <p>${book.desc}</p>
            <p>رقم: ${book.code}</p>

            <input placeholder="الاسم الثلاثي + الصف">

            <input type="date" min="${todayDate()}" value="${todayDate()}">

            <button onclick="reserve(${index})">حجز</button>
            <button onclick="cancel(${index})">إلغاء الحجز</button>

            <div class="status">الحالة: متاح</div>
        </div>
        `;

        const bookRef = ref(db,"books/"+index);

        onValue(bookRef,(snapshot)=>{
            const data = snapshot.val();
            if(data){
                const box = document.getElementById("book-"+index);
                box.querySelector(".status").innerText =
                "محجوز باسم: " + data.name + " | تاريخ الارجاع: " + data.date;

                box.querySelector(".status").classList.add("reserved");
                box.querySelector("input").value = data.name;
                box.querySelector("input").disabled = true;
                box.querySelectorAll("input")[1].disabled = true;
                box.querySelector("button:first-of-type").disabled = true;
            }
        });

    });
}

window.reserve = function(index){

    const box = document.getElementById("book-"+index);
    const name = box.querySelector("input").value;
    const date = box.querySelectorAll("input")[1].value;

    const today = todayDate();

    if(name===""){
        alert("اكتبي الاسم والصف!");
        return;
    }

    if(date < today){
        alert("❌ لا يمكن اختيار تاريخ قديم!");
        return;
    }

    set(ref(db,"books/"+index), {
        name:name,
        date:date
    });

};

window.cancel = function(index){

    const box = document.getElementById("book-"+index);

    set(ref(db,"books/"+index), null);

    box.querySelector(".status").innerText = "الحالة: متاح";
    box.querySelector(".status").classList.remove("reserved");

    box.querySelector("input").disabled = false;
    box.querySelectorAll("input")[1].disabled = false;

    box.querySelector("input").value = "";
    box.querySelector("button:first-of-type").disabled = false;
};

window.searchBooks = function(){
    const value = document.getElementById("search").value.toLowerCase();
    const filtered = books.filter(b=>b.title.toLowerCase().includes(value));
    displayBooks(filtered);
}

displayBooks(books);
